{% extends "base_app.html" %}
{% block title %}Profile - AgriGuide{% endblock %}
{% block content %}

<div class="panel" style="max-width:480px;">
  <h2>👤 My Profile</h2>
  <p class="sub">Your account information</p>
  <div class="crop-result-item"><span class="name">Name</span><span>{{ user.name }}</span></div>
  <div class="crop-result-item"><span class="name">Email</span><span>{{ user.email }}</span></div>
  <div class="crop-result-item"><span class="name">Role</span><span>{{ user.role }}</span></div>
  <div class="crop-result-item"><span class="name">Joined</span><span>{{ user.created_at }}</span></div>
</div>

{% endblock %}
